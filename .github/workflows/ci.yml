name: Spendix CI

on:
  push:
    branches:
      - main
      - dev/backend-core
      - dev/frontend-core
      - dev/frontend-modules
  pull_request:
    branches:
      - main

jobs:
  backend-check:
    name: Backend — Install and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm install

      - name: Check for hardcoded secrets
        run: |
          if grep -r "GROQ_API_KEY\s*=" client/src/ 2>/dev/null; then
            echo "FAIL: GROQ_API_KEY found in client source files"
            exit 1
          fi
          if grep -r "JWT_SECRET\s*=" client/src/ 2>/dev/null; then
            echo "FAIL: JWT_SECRET found in client source files"
            exit 1
          fi
          echo "PASS: No secrets found in client source"

      - name: Check for direct SQL string concatenation
        run: |
          if grep -rn "query(\`" server/controllers/ 2>/dev/null; then
            echo "WARN: Possible template literal in SQL query — use ? placeholders"
          fi
          echo "SQL check complete"

  frontend-build:
    name: Frontend — Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm install

      - name: Build frontend
        working-directory: client
        run: npm run build
        env:
          NODE_ENV: production

      - name: Confirm build output exists
        run: |
          if [ ! -d "client/dist" ]; then
            echo "FAIL: Build output directory client/dist not found"
            exit 1
          fi
          echo "PASS: Build output exists"

  env-safety:
    name: Environment — No .env Committed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check .env not committed
        run: |
          if [ -f ".env" ]; then
            echo "FAIL: .env file is committed to the repository"
            exit 1
          fi
          echo "PASS: .env not committed"

      - name: Check .env.example exists
        run: |
          if [ ! -f ".env.example" ]; then
            echo "WARN: .env.example is missing — add it so team members know required vars"
          else
            echo "PASS: .env.example exists"
          fi
